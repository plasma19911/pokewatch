# Täglicher Lauf für PokeWatch
#
# Angepasst an das, was im Repository liegt: pokewatch.py baut, das Ergebnis
# landet in output/, seen.json und channels.json halten den Zustand.
#
# BEVOR DU DAS EINSETZT: schau in deine vorhandene
# .github/workflows/pokewatch.yml. Läuft dort etwas, das hier fehlt - etwa
# ein Argument hinter pokewatch.py, ein Zugangsschlüssel unter "secrets"
# oder ein zusätzlicher Schritt -, muss das übernommen werden. Diese Datei
# ersetzt die alte nur dann gefahrlos, wenn dein Lauf wirklich aus
# "python pokewatch.py" besteht.

name: PokeWatch

on:
  schedule:
    # Krumme Minuten mit Absicht: zur vollen und halben Stunde überspringt
    # GitHub geplante Läufe regelmäßig wegen Überlastung.
    #   05:23 UTC = 07:23 deutscher Sommerzeit
    #   11:53 UTC = 13:53 deutscher Sommerzeit (Auffangnetz)
    - cron: "23 5 * * *"
    - cron: "53 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pokewatch
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Repository holen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          if [ -f requirements.txt ]; then
            pip install --quiet -r requirements.txt
          else
            # Uebliche Verdaechtige fuer Feeds, Bildbau und Textclustering.
            # Was pokewatch.py nicht braucht, stoert hier auch nicht.
            pip install --quiet requests feedparser pillow || true
          fi

      - name: Feed bauen
        run: python pokewatch.py

      # Nicht nur pruefen, OB output/ existiert, sondern ob in DIESEM Lauf
      # etwas darin neu geschrieben wurde. Sonst wirkt ein Lauf erfolgreich,
      # der in Wahrheit nichts erneuert hat.
      - name: Prüfen, ob wirklich etwas Neues entstanden ist
        run: |
          if [ ! -d output ]; then
            echo "::error::Der Ordner output/ fehlt - pokewatch.py hat nichts erzeugt."
            exit 1
          fi
          frisch=$(find output -type f -newermt '-60 minutes' | wc -l)
          echo "In output/ liegen $(find output -type f | wc -l) Dateien, davon $frisch frisch."
          if [ "$frisch" -eq 0 ]; then
            echo "::error::In output/ wurde nichts neu geschrieben."
            exit 1
          fi

      - name: Ergebnis zurück ins Repository schreiben
        run: |
          git config user.name "pokewatch-bot"
          git config user.email "actions@github.com"
          # -f, damit keine .gitignore-Regel den Ausgabeordner verschluckt.
          git add -A -f output
          git add -A seen.json channels.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Keine Aenderungen - nichts zu committen."
          else
            git commit -m "Feed: $(date -u '+%Y-%m-%d %H:%M') UTC"
            # Falls zwischenzeitlich ein anderer Lauf geschrieben hat:
            # erst nachziehen, dann schieben. Das verhindert den haeufigsten
            # Grund fuer einen roten Lauf am Ende.
            git pull --rebase --autostash || true
            git push
          fi

      - name: Zusammenfassung
        if: always()
        run: |
          {
            echo "### PokeWatch"
            if [ -d output ]; then
              echo "Dateien in output/: $(find output -type f | wc -l)"
              echo ""
              echo "Zuletzt geändert:"
              find output -type f -printf '%TY-%Tm-%Td %TH:%TM  %p\n' 2>/dev/null | sort -r | head -5
            else
              echo "Kein output/ vorhanden."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
