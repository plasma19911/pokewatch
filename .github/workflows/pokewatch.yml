name: PokeWatch

on:
  schedule:
    - cron: "0 5 * * *"      # taeglich 05:00 UTC = 07:00 deutscher Sommerzeit
  workflow_dispatch:          # zusaetzlich der Knopf "Run workflow" auf github.com

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pokewatch
  cancel-in-progress: false

jobs:
  sammeln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Feed abrufen
        env:
          # Optional. Anlegen unter:
          # Settings -> Secrets and variables -> Actions -> New repository secret
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 pokewatch.py --days 45

      - name: Ergebnis zurueckschreiben
        # seen.json muss mit zurueck, sonst gilt beim naechsten Lauf
        # wieder alles als neu und du bekommst 100 Meldungen auf einmal.
        run: |
          rm -rf __pycache__            # Python-Bytecode gehoert nicht ins Repo
          git config user.name "pokewatch-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Feed: $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: output
      - uses: actions/deploy-pages@v4
