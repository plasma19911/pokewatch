# PokeWatch - täglicher Lauf mit Veröffentlichung
#
# Diese Fassung stellt die drei Pages-Schritte wieder her, die in meiner
# vorigen Vorlage fehlten. Sie stammen aus dem Log deines Laufs #2:
#   actions/configure-pages@v5
#   actions/upload-pages-artifact@v3
#   actions/deploy-pages@v4
#
# Der veröffentlichte Ordner ist output/ - erkennbar daran, dass deine Seite
# unter /pokewatch/ die Dateien aus output/ ausliefert, und GitHub Pages im
# Modus "Deploy from a branch" nur / und /docs anbietet.
#
# BITTE NACH DEM EINSETZEN PRÜFEN: Lauf von Hand starten und schauen, ob
# ALLE Schritte grün werden, besonders die drei am Ende. Ich habe deine
# ursprüngliche Datei nie gesehen und diese Schritte aus dem Log
# rekonstruiert - falls dort noch etwas anderes stand (ein Argument hinter
# pokewatch.py, ein Zugangsschlüssel), fehlt es hier.

name: PokeWatch

on:
  schedule:
    # Alle zwei Stunden zur 23. Minute - zwölf Läufe am Tag:
    #   00:23  02:23  04:23  06:23  08:23  10:23 ... 22:23  (UTC)
    #   02:23  04:23  06:23  08:23  10:23  12:23 ... 00:23  (Sommerzeit)
    #
    # Krumme Minute mit Absicht: zur vollen und halben Stunde überspringt
    # GitHub geplante Läufe gern wegen Überlastung.
    #
    # Ein cron braucht immer FÜNF Felder: Minute, Stunde, Tag, Monat,
    # Wochentag. "13 */2 * * " mit vier Feldern lehnt GitHub ab.
    # Andere Rhythmen: "23 * * * *" stündlich, "23 */6 * * *" alle sechs
    # Stunden, "23 5 * * *" einmal täglich um 05:23 UTC.
    - cron: "23 */2 * * *"
    # Nachschlag eine halbe Stunde später. Fiel der erste Termin aus, greift
    # dieser; lief er durch, findet der zweite nichts Neues und committet
    # nichts. Die Minuten 23 und 53 sind bewusst andere als beim Scanner
    # (13 und 43), damit sich die beiden Projekte nicht ins Gehege kommen.
    - cron: "53 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write   # zum Zurückschreiben von output/ und seen.json
  pages: write      # zum Veröffentlichen
  id-token: write   # verlangt deploy-pages

concurrency:
  group: pokewatch
  cancel-in-progress: false

jobs:
  sammeln:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Repository holen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          if [ -f requirements.txt ]; then
            pip install --quiet -r requirements.txt
          else
            pip install --quiet requests feedparser pillow || true
          fi

      - name: Feed abrufen
        run: python pokewatch.py

      # Nicht nur pruefen, OB output/ existiert, sondern ob in DIESEM Lauf
      # etwas darin neu geschrieben wurde.
      - name: Prüfen, ob wirklich etwas Neues entstanden ist
        run: |
          if [ ! -d output ]; then
            echo "::error::Der Ordner output/ fehlt - pokewatch.py hat nichts erzeugt."
            exit 1
          fi
          frisch=$(find output -type f -newermt '-60 minutes' | wc -l)
          echo "In output/ liegen $(find output -type f | wc -l) Dateien, davon $frisch frisch."
          if [ "$frisch" -eq 0 ]; then
            echo "::error::In output/ wurde nichts neu geschrieben."
            exit 1
          fi

      - name: Ergebnis zurueckschreiben
        run: |
          rm -rf __pycache__          # Python-Bytecode gehoert nicht ins Repo
          git config user.name "pokewatch-bot"
          git config user.email "actions@github.com"
          git add -A -f output
          git add -A seen.json channels.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Keine Aenderungen - nichts zu committen."
          else
            git commit -m "Feed: $(date -u '+%Y-%m-%d %H:%M') UTC"
            # Das war der Fehler in Lauf #2: hast du waehrenddessen etwas
            # ueber die Weboberflaeche geaendert, lehnt GitHub den Push ab
            # ("fetch first"). Erst nachziehen, dann schieben.
            git pull --rebase --autostash
            git push
          fi

      # --- Veröffentlichen -------------------------------------------------
      # Diese drei Schritte liefern output/ als Webseite aus. Ohne sie bleibt
      # plasma19911.github.io/pokewatch/ auf dem alten Stand, egal wie frisch
      # der Feed im Repository ist.

      - name: Pages vorbereiten
        uses: actions/configure-pages@v5

      - name: output/ als Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

      - name: Seite veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Zusammenfassung
        if: always()
        run: |
          {
            echo "### PokeWatch"
            if [ -d output ]; then
              echo "Dateien in output/: $(find output -type f | wc -l)"
              echo ""
              echo "Zuletzt geändert:"
              find output -type f -printf '%TY-%Tm-%Td %TH:%TM  %p\n' 2>/dev/null | sort -r | head -5
            else
              echo "Kein output/ vorhanden."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
